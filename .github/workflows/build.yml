name: Build

on:
  push:
  workflow_dispatch:

env:
  IMAGE_NAME: rubysolo/alpine-elixir-phoenix

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Derive tags from base image
        id: tags
        run: |
          from=$(grep '^FROM' Dockerfile | sed -e 's/.*://')
          elixir=${from%%-*}
          elixir_minor=$(echo "$elixir" | cut -d. -f1,2)
          {
            echo "tags<<EOF"
            echo "$IMAGE_NAME:$from"
            echo "$IMAGE_NAME:$elixir"
            echo "$IMAGE_NAME:$elixir_minor"
            echo "$IMAGE_NAME:latest"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Docker Hub login
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v4
        with:
          username: rubysolo
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref_name == github.event.repository.default_branch }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
